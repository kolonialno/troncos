[project]
name = "troncos"
version = "8.0.1" # x-release-please-version
description = "Collection of Python logging and tracing tools"
authors = [
  { name = "Guðmundur Björn Birkisson", email = "gudmundur.birkisson@oda.com" },
  { name = "Karl Fredrik Haugland", email = "karlfredrik.haugland@oda.com" },
  { name = "Eirik Martiniussen Sylliaas", email = "eirik.sylliaas@oda.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["logs", "traces", "opentelemetry"]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "ddtrace==4.7.2",
  "opentelemetry-exporter-otlp-proto-http>=1.19,<2",
  "opentelemetry-sdk>=1.19,<2",
  "python-ipware>=2,<4",
]

[project.urls]
Homepage = "https://github.com/kolonialno/troncos"
Repository = "https://github.com/kolonialno/troncos"
Documentation = "https://github.com/kolonialno/troncos"

[project.optional-dependencies]
grpc = ["opentelemetry-exporter-otlp-proto-grpc>=1.19,<2"]
sentry = ["structlog-sentry>=2.0.0,<3"]

[dependency-groups]
dev = [
  "celery>=5.6.2,<6",
  "django>=5.2.3,<6",
  "django-environ>=0.14.0,<0.15",
  "fastapi>=0.128.0,<1",
  "ipython>=9.9.0,<10",
  "mkdocs-techdocs-core>=1.6.1,<2",
  "mypy>=2.3.1,<3",
  "pytest>=9.0.2,<10",
  "pytest-codeblocks>=0.18.0,<0.19",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-benchmark>=5.2.3,<6",
  "pytest-cov>=7.0.0,<8",
  "pytest-httpserver>=1.0.8,<2",
  "requests>=2.31.0,<3",
  "snakeviz>=2.2.0,<3",
  "structlog>=26.1.0,<27",
  "types-requests>=2.32.4.20260107,<3",
  "ruff>=0.16.5,<0.17",
  "pytest-env>=1.2.0,<2",
  "pydantic>=2.12.5,<3",
  "cffi>=2.1.1,<3",
  "grpcio>=1.76.0,<2",
]


[tool.mypy]
python_version = "3.11"
files = ["./troncos", "./tests"]
namespace_packages = true
show_error_codes = true
ignore_missing_imports = true
follow_imports = "normal"
strict = true

[[tool.mypy.overrides]]
module = ["opentelemetry.sdk.*", "opentelemetry.context.*"]
implicit_reexport = true

[tool.pytest.ini_options]
minversion = 6.0
python_files = "test_*.py"
python_functions = "test_*"
cache_dir = ".pytest_cache"
# Silence warning by opting in to use pytest 6's new default value
junit_family = "xunit2"
# Include captured log messages in system-out in Jenkins report file
junit_logging = "system-out"
console_output_style = "classic"
empty_parameter_set_mark = "xfail"
log_cli_level = "INFO"
log_level = "INFO"
ddtrace = 0
filterwarnings = [
  "error",
  "ignore:Type google._upb._message.MessageMapContainer:DeprecationWarning:",
  "ignore:Type google._upb._message.ScalarMapContainer:DeprecationWarning:",
  "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:",
  "ignore:pkg_resources is deprecated as an API:DeprecationWarning:",
  "ignore:Deprecated call to `pkg_resources:DeprecationWarning:",
]
addopts = [
  # Absolute benchmark timings are noise on a shared runner, so pytest-benchmark
  # tests are opt-in via `mise run benchmark`. The ratio-based performance gate in
  # tests/tracing/test_perf.py is not a benchmark test and still runs here.
  "--benchmark-skip",
]
env = [
    "DD_TRACE_ENABLED=True",
]


[tool.ruff]
line-length = 88
exclude = [
    ".git",
    ".github",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    # Regular flake8 rules
    "C", "E", "F", "W",
    # flake8-bugbear rules
    "B",
    # Import sorting rules
    # "I",
    # flake8-comprehensions
    "C4",
    # flake8 django
    "DJ",
    # Pylint rules
    "PLC", "PLE", "PLR", "PLW",
    # Ruff
    "RUF",
]
ignore = [
  # C901 is too complex
  "C901",

  # PLC0415 Import should be at the top-level of a file
  "PLC0415",
  # PLR2004 Magic value used in comparison
  "PLR2004",
  # PLR0913 Too many arguments in function definition
  "PLR0913",
  # PLR0917 Too many positional arguments
  "PLR0917",
]

[tool.hatch.build.targets.wheel]
packages = ["troncos"]

[tool.hatch.build.targets.sdist]
include = ["/troncos", "/README.md", "/LICENSE"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
